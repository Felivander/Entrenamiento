<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutina">
<title>Rutina</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14202b;--mu:#667585;--ac:#1f6fb2;--ok:#1e9e5a;--bd:#dfe5ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--card:#18212a;--tx:#e8eef4;--mu:#8fa0b0;--ac:#4aa3e8;--ok:#33c47a;--bd:#2a3744}}
:root[data-theme="dark"]{--bg:#0e141a;--card:#18212a;--tx:#e8eef4;--mu:#8fa0b0;--ac:#4aa3e8;--ok:#33c47a;--bd:#2a3744}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:14px 14px 150px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;font-weight:600}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.pt{font-size:13px;color:var(--mu);margin-bottom:12px}
.win{background:var(--ok);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:12px}
h2{font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.nm{font-weight:700}
.mt{color:var(--mu);font-size:13px;margin-bottom:8px}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--ac);background:transparent;color:var(--ac);font-size:16px;font-weight:700}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.next{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.dot:disabled{opacity:.4;border-color:var(--bd);color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:8px 2px}
.rst{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
#bar .in{max-width:560px;margin:0 auto}
#bl{font-size:13px;color:var(--mu);text-align:center}
#bt{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#bt.work{color:var(--ac)}#bt.rest{color:var(--ok)}
.br{display:flex;gap:8px;margin-top:8px}
.br button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-weight:600}
</style>
</head>
<body>
<h1>Rutina en casa</h1>
<div class="sub" id="dt"></div>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<div id="bar"><div class="in">
  <div id="bl"></div><div id="bt">0:00</div>
  <div class="br"><button id="b15">+15 s</button><button id="bsk">Saltar</button><button id="bx">Cancelar</button></div>
</div></div>

<script>
var D={
1:['Lunes · Tren superior',[['Dominadas',5,'4-8 reps',90],['Flexiones',4,'10-15 reps',75],['Fondos de tríceps en banco',3,'12-15 reps',60],['Flexiones diamante o inclinadas',3,'al fallo −2',60],['Colgarse de la barra',3,'30 s',60,30]]],
2:['Martes · Piernas y potencia',[['Sentadilla búlgara',4,'8-10 por pierna',90],['Sentadilla con salto',4,'6 reps',90],['Zancadas caminando',3,'12 por pierna',60],['Puente de glúteos a una pierna',3,'12 por pierna',60],['Elevación de talones',3,'20 reps',45]]],
3:['Miércoles · Cardio y agilidad',[['Soga (1 min saltando)',10,'1 min',30,60],['Trote suave o caminata rápida',1,'15 min',0,900],['Escalera de agilidad casera',8,'30 s',30,30]]],
4:['Jueves · Cuerpo completo',[['Chin-ups (agarre supino)',4,'4-8 reps',90],['Flexiones con pausa abajo',4,'8-10 reps',75],['Sentadilla con pausa de 2 s',4,'12 reps',75],['Remo invertido bajo mesa firme',3,'10 reps',60],['Fondos de tríceps en banco',3,'12 reps',60]]],
5:['Viernes · Específico de fútbol',[['Sprints de 20-30 m',8,'1 sprint',60],['Intervalos 30 s fuerte / 30 s suave',10,'30 s fuerte',30,30],['Slalom o drill en T con conos',6,'1 recorrido',45],['Saltos al banco',3,'6 reps',60]]]
};
var C=[['Plancha',3,'30-45 s',45,40],['Dead bug',3,'10 por lado',45],['Bird dog',3,'10 por lado',45],['Plancha lateral',3,'20-30 s por lado',45,25],['Puente de glúteos con pausa',3,'12 reps',45]];
var DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var now=new Date(),dow=now.getDay(),cur=(dow>=1&&dow<=5)?dow:1;
var dk=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
var S={};try{S=JSON.parse(localStorage.getItem('rutina-v1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('rutina-v1',JSON.stringify(S))}catch(e){}}
function get(day,k){return ((S[dk]||{})[day+k])||0}
function put(day,k,v){S[dk]=S[dk]||{};S[dk][day+k]=v;save()}

var AC=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  try{if(navigator.wakeLock&&!unlock.wl)navigator.wakeLock.request('screen').then(function(l){unlock.wl=l;l.addEventListener('release',function(){unlock.wl=null})}).catch(function(){})}catch(e){}}
function beep(f,d){if(!AC)return;try{var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.5,AC.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.05)}catch(e){}}
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}

var T=null,iv=null;
function startTimer(sec,label,kind,onEnd){T={end:Date.now()+sec*1000,label:label,kind:kind,onEnd:onEnd,last:null,skip:false};clearInterval(iv);iv=setInterval(tick,250);tick()}
function tick(){
  if(!T){document.getElementById('bar').style.display='none';return}
  var left=Math.ceil((T.end-Date.now())/1000);
  if(left<=0){var f=T.onEnd,sk=T.skip;T=null;clearInterval(iv);document.getElementById('bar').style.display='none';if(!sk){beep(880,.2);setTimeout(function(){beep(1100,.4)},230)}if(f)f();return}
  if(left<=3&&T.last!==left){T.last=left;beep(660,.12)}
  document.getElementById('bar').style.display='block';
  document.getElementById('bl').textContent=T.label;
  var bt=document.getElementById('bt');bt.textContent=fmt(left);bt.className=T.kind;
}
document.getElementById('b15').onclick=function(){if(T){T.end+=15000;tick()}};
document.getElementById('bsk').onclick=function(){if(T){T.skip=true;T.end=0;tick()}};
document.getElementById('bx').onclick=function(){T=null;clearInterval(iv);tick()};

function tapDot(day,k,ex,i){
  unlock();
  var c=get(day,k);
  if(i<c){put(day,k,i);render();return}
  if(i>c)return;
  var name=ex[0],sets=ex[1],rest=ex[3],work=ex[4];
  function finish(){
    put(day,k,i+1);render();
    if(i+1<sets&&rest>0)startTimer(rest,'Descanso · '+name+' (serie '+(i+2)+' de '+sets+')','rest',null);
  }
  if(work){startTimer(work,name+' · serie '+(i+1)+' de '+sets,'work',finish)}
  else{beep(520,.08);finish()}
}

function card(day,k,ex){
  var c=get(day,k),h='<div class="card"><div class="nm">'+ex[0]+'</div><div class="mt">'+ex[1]+' × '+ex[2]+(ex[3]?' · descanso '+ex[3]+' s':'')+(ex[4]?' · cronómetro '+fmt(ex[4]):'')+'</div><div class="dots">';
  for(var i=0;i<ex[1];i++){
    h+='<button class="dot'+(i<c?' done':'')+(i===c?' next':'')+'" data-d="'+day+'" data-k="'+k+'" data-i="'+i+'"'+(i>c?' disabled':'')+'>'+(i<c?'✓':(i+1))+'</button>';
  }
  return h+'</div></div>';
}

function render(){
  var tabs='';for(var d=1;d<=5;d++)tabs+='<button class="tab'+(d===cur?' on':'')+'" data-t="'+d+'">'+DN[d]+'</button>';
  document.getElementById('tabs').innerHTML=tabs;
  document.getElementById('dt').textContent=DN[dow]+' '+now.getDate()+'/'+(now.getMonth()+1)+(dow===0||dow===6?' · hoy es descanso activo':'');
  var day=D[cur],tot=0,done=0,h='';
  var all=[];day[1].forEach(function(e,i){all.push(['e'+i,e])});C.forEach(function(e,i){all.push(['c'+i,e])});
  all.forEach(function(a){tot+=a[1][1];done+=get(cur,a[0])});
  h+='<div class="prog"><i style="width:'+(tot?done/tot*100:0)+'%"></i></div><div class="pt">'+day[0]+' · '+done+' de '+tot+' series</div>';
  if(done===tot&&tot>0)h+='<div class="win">¡Sesión completa! 🎉</div>';
  h+='<div class="note">Antes: 8 min de entrada en calor (soga suave, movilidad).</div><h2>Bloque principal</h2>';
  day[1].forEach(function(e,i){h+=card(cur,'e'+i,e)});
  h+='<h2>Core</h2><div class="note">Progresá de a poco; frená si sentís tirón, dolor o un bulto en la cicatriz.</div>';
  C.forEach(function(e,i){h+=card(cur,'c'+i,e)});
  h+='<button class="rst" id="rst">Reiniciar este día</button>';
  document.getElementById('main').innerHTML=h;
}
var rsT=null;
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.dataset.t){cur=+t.dataset.t;render();return}
  if(t.dataset.k!==undefined&&t.dataset.i!==undefined){
    var day=+t.dataset.d,k=t.dataset.k,ex=k[0]==='e'?D[day][1][+k.slice(1)]:C[+k.slice(1)];
    tapDot(day,k,ex,+t.dataset.i);return}
  if(t.id==='rst'){
    if(rsT){clearTimeout(rsT);rsT=null;if(S[dk]){Object.keys(S[dk]).forEach(function(x){if(x.charAt(0)==cur)delete S[dk][x]})}save();render()}
    else{t.textContent='Tocá otra vez para confirmar';rsT=setTimeout(function(){rsT=null;var b=document.getElementById('rst');if(b)b.textContent='Reiniciar este día'},3000)}
  }
});
render();
</script>
</body>
</html>
