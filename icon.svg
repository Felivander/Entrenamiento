<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c131a"/>
      <stop offset="50%" stop-color="#14212e"/>
      <stop offset="100%" stop-color="#0a1016"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2a3c4f" stroke-width="4" opacity="0.6"/>

  <!-- Centered Fitness Graphic (Stylized Dumbbell + Energy Pulse) -->
  <g transform="translate(256, 256) rotate(-45)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#e2e8f0"/>
    <rect x="-50" y="-16" width="100" height="32" rx="8" fill="url(#primaryGrad)"/>

    <!-- Left Weight Plates -->
    <rect x="-132" y="-55" width="26" height="110" rx="12" fill="url(#primaryGrad)"/>
    <rect x="-162" y="-72" width="24" height="144" rx="12" fill="url(#primaryGrad)"/>
    <rect x="-186" y="-85" width="18" height="170" rx="9" fill="#1e293b"/>

    <!-- Right Weight Plates -->
    <rect x="106" y="-55" width="26" height="110" rx="12" fill="url(#primaryGrad)"/>
    <rect x="138" y="-72" width="24" height="144" rx="12" fill="url(#primaryGrad)"/>
    <rect x="168" y="-85" width="18" height="170" rx="9" fill="#1e293b"/>
  </g>

  <!-- Subtle Dynamic Energy Lightning Accent -->
  <path d="M260 120 L220 250 L270 250 L240 390 L320 240 L275 240 Z" 
        fill="url(#primaryGrad)" opacity="0.95" filter="url(#glow)"/>
</svg>
