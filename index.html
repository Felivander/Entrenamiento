<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Rutina · Felipe & Mawi</title>
<style>
:root {
  --bg: #0c1218;
  --bg-soft: #121b24;
  --card: #16222e;
  --card-hover: #1b2a3a;
  --tx: #f0f4f8;
  --mu: #94a3b8;
  --ac: #38bdf8;
  --ac-glow: rgba(56, 189, 248, 0.25);
  --ok: #10b981;
  --ok-glow: rgba(16, 185, 129, 0.25);
  --warn: #f59e0b;
  --pink: #ec4899;
  --pink-glow: rgba(236, 72, 153, 0.25);
  --bd: #233446;
  --bd-light: #2e445b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #f8fafc;
  --bg-soft: #f1f5f9;
  --card: #ffffff;
  --card-hover: #f8fafc;
  --tx: #0f172a;
  --mu: #64748b;
  --ac: #0284c7;
  --ac-glow: rgba(2, 132, 199, 0.18);
  --ok: #059669;
  --ok-glow: rgba(5, 150, 105, 0.18);
  --warn: #d97706;
  --pink: #db2777;
  --pink-glow: rgba(219, 39, 119, 0.18);
  --bd: #e2e8f0;
  --bd-light: #cbd5e1;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  padding: 14px 14px 175px;
  max-width: 580px;
  user-select: none;
  -webkit-user-select: none;
  transition: background-color 0.2s, color 0.2s;
}

/* Header & Profile Switcher */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 8px;
}
.profile-switcher {
  display: flex;
  background: var(--bg-soft);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 3px;
  gap: 3px;
}
.profile-btn {
  background: transparent;
  border: none;
  color: var(--mu);
  font-size: 14px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.profile-btn.active[data-p="felipe"] {
  background: var(--ac);
  color: #041019;
  box-shadow: 0 2px 8px var(--ac-glow);
}
.profile-btn.active[data-p="mawi"] {
  background: var(--pink);
  color: #ffffff;
  box-shadow: 0 2px 8px var(--pink-glow);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}
.btn-icon {
  background: var(--card);
  border: 1px solid var(--bd);
  color: var(--tx);
  width: 35px;
  height: 35px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-icon:active { transform: scale(0.92); }
.btn-icon.off {
  opacity: 0.45;
  color: var(--mu);
}
.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--bd);
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 700;
  color: #fb923c;
  white-space: nowrap;
}
.sub {
  color: var(--mu);
  font-size: 13.5px;
  margin-bottom: 12px;
}

/* Info Banner for Mawi */
.info-card {
  background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(56, 189, 248, 0.08));
  border: 1px solid var(--pink-glow);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  line-height: 1.5;
}
.info-card summary {
  font-weight: 700;
  color: var(--pink);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.info-card summary::-webkit-details-marker { display: none; }
.info-card summary::after {
  content: '▾';
  font-size: 14px;
  transition: transform 0.2s;
}
.info-card[open] summary::after {
  transform: rotate(180deg);
}
.info-card ul {
  margin: 10px 0 0;
  padding-left: 18px;
  color: var(--tx);
}
.info-card li { margin-bottom: 5px; }

/* Weekly streak pills */
.week-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  background: var(--bg-soft);
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--bd);
}
.week-day {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--mu);
  font-weight: 600;
}
.week-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--bd);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--mu);
  transition: all 0.2s ease;
}
.week-dot.active-day {
  border-color: var(--ac);
  box-shadow: 0 0 0 2px var(--ac-glow);
}
.week-dot.done {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
  font-weight: 800;
  box-shadow: 0 2px 6px var(--ok-glow);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  min-width: 58px;
  padding: 10px 0;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tab:active { transform: scale(0.96); }
.tab.on {
  background: var(--ac);
  color: #041019;
  border-color: var(--ac);
  box-shadow: 0 2px 10px var(--ac-glow);
}
body[data-active-p="mawi"] .tab.on {
  background: var(--pink);
  color: #ffffff;
  border-color: var(--pink);
  box-shadow: 0 2px 10px var(--pink-glow);
}

/* Progress bar */
.prog-box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
.prog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 600;
}
.prog-title { color: var(--tx); font-weight: 700; }
.prog-stats { color: var(--mu); }
.prog {
  height: 9px;
  background: var(--bg-soft);
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--bd);
}
.prog i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--ac), var(--ok));
  transition: width 0.35s ease;
}
body[data-active-p="mawi"] .prog i {
  background: linear-gradient(90deg, var(--pink), var(--ok));
}

/* Celebration win card */
.win {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(56, 189, 248, 0.2));
  border: 1px solid var(--ok);
  color: var(--tx);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  font-weight: 700;
  margin-bottom: 14px;
  animation: popIn 0.3s ease;
}
@keyframes popIn {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Section titles & notes */
h2 {
  font-size: 14px;
  font-weight: 800;
  color: var(--mu);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 22px 2px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.note-warn {
  background: rgba(245, 158, 11, 0.12);
  border-left: 3px solid var(--warn);
  padding: 10px 12px;
  border-radius: 0 10px 10px 0;
  color: #fde68a;
  font-size: 13px;
  margin: 8px 0 14px;
  line-height: 1.45;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  transition: border-color 0.2s, background 0.2s;
}
.card:hover {
  border-color: var(--bd-light);
}
.card.all-done {
  border-color: rgba(16, 185, 129, 0.45);
  background: rgba(22, 34, 46, 0.85);
}
:root[data-theme="light"] .card.all-done {
  background: #f0fdf4;
}
.row {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 12px;
}

/* GIF preview box */
.gif-box {
  flex: 0 0 96px;
  width: 96px;
  height: 96px;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid var(--bd);
  overflow: hidden;
  position: relative;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gif-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.2s ease;
}
.gif-box:hover img {
  transform: scale(1.05);
}
.gif-expand {
  position: absolute;
  right: 4px;
  bottom: 4px;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  border-radius: 6px;
  padding: 2px 5px;
  font-size: 10px;
  font-weight: 700;
  pointer-events: none;
}
.gif-fallback {
  color: var(--ac);
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  padding: 6px;
}

/* Exercise info */
.ex-info {
  flex: 1;
  min-width: 0;
}
.nm {
  font-size: 16px;
  font-weight: 700;
  color: var(--tx);
  margin-bottom: 4px;
  line-height: 1.25;
}
.mt {
  color: var(--mu);
  font-size: 13.5px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.pill {
  display: inline-block;
  background: var(--bg-soft);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 2px 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--mu);
}
.pill-timer {
  color: var(--ac);
  border-color: rgba(56, 189, 248, 0.4);
}
body[data-active-p="mawi"] .pill-timer {
  color: var(--pink);
  border-color: var(--pink-glow);
}
.btn-info {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: transparent;
  border: none;
  color: var(--ac);
  font-size: 12px;
  font-weight: 600;
  padding: 0;
  margin-top: 6px;
  cursor: pointer;
}
body[data-active-p="mawi"] .btn-info {
  color: var(--pink);
}

/* Series dots */
.dots {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  padding-top: 4px;
}
.dot {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--ac);
  background: transparent;
  color: var(--ac);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
body[data-active-p="mawi"] .dot {
  border-color: var(--pink);
  color: var(--pink);
}
.dot:active {
  transform: scale(0.9);
}
.dot.done {
  background: var(--ok);
  border-color: var(--ok);
  color: #ffffff;
  box-shadow: 0 2px 8px var(--ok-glow);
}
.dot.next {
  border-color: var(--ac);
  background: rgba(56, 189, 248, 0.12);
  box-shadow: 0 0 0 4px var(--ac-glow);
  animation: pulseNext 2s infinite ease-in-out;
}
body[data-active-p="mawi"] .dot.next {
  border-color: var(--pink);
  background: rgba(236, 72, 153, 0.12);
  box-shadow: 0 0 0 4px var(--pink-glow);
}
@keyframes pulseNext {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
.dot:disabled {
  opacity: 0.35;
  border-color: var(--bd);
  color: var(--mu);
  cursor: not-allowed;
}

/* Bottom floating timer bar */
#bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--card);
  border-top: 1px solid var(--bd);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: none;
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
  z-index: 100;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
#bar .in {
  max-width: 580px;
  margin: 0 auto;
}
.timer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
#bl {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--mu);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
#bmode {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 6px;
}
#bmode.work { background: rgba(56, 189, 248, 0.2); color: var(--ac); }
body[data-active-p="mawi"] #bmode.work { background: rgba(236, 72, 153, 0.2); color: var(--pink); }
#bmode.rest { background: rgba(16, 185, 129, 0.2); color: var(--ok); }
#bmode.paused { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
.timer-mid {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  margin: 2px 0 6px;
}
#bt {
  font-size: 48px;
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
#bt.work { color: var(--ac); }
body[data-active-p="mawi"] #bt.work { color: var(--pink); }
#bt.rest { color: var(--ok); }
#bt.paused { opacity: 0.6; }
.timer-prog {
  height: 5px;
  background: var(--bg-soft);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 10px;
}
.timer-prog i {
  display: block;
  height: 100%;
  background: var(--ok);
  transition: width 0.25s linear;
}
#bt.work ~ .timer-prog i { background: var(--ac); }
body[data-active-p="mawi"] #bt.work ~ .timer-prog i { background: var(--pink); }
.br {
  display: flex;
  gap: 8px;
}
.br button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  background: var(--bg-soft);
  color: var(--tx);
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}
.br button:active { transform: scale(0.96); background: var(--bd); }
.br #b15 { color: var(--ac); }
body[data-active-p="mawi"] .br #b15 { color: var(--pink); }
.br #bpause { color: var(--warn); }
.br #bsk { color: var(--ok); }
.br #bx { color: var(--mu); }

/* Technique Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 200;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--bd-light);
  border-radius: 20px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  padding: 20px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.modal-title {
  font-size: 18px;
  font-weight: 800;
  margin: 0;
  color: var(--tx);
}
.modal-close {
  background: var(--bg-soft);
  border: 1px solid var(--bd);
  color: var(--mu);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
}
.modal-gif-box {
  width: 100%;
  height: 220px;
  background: #ffffff;
  border-radius: 14px;
  border: 1px solid var(--bd);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.modal-gif-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.modal-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.modal-nav button {
  flex: 1;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--bd);
  background: var(--bg-soft);
  color: var(--tx);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.modal-tips {
  margin-bottom: 16px;
}
.modal-tips h3 {
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--mu);
  margin: 0 0 8px;
}
.modal-tips ul {
  margin: 0;
  padding-left: 20px;
  font-size: 13.5px;
  color: var(--tx);
  line-height: 1.5;
}
.modal-tips li { margin-bottom: 6px; }
.modal-yt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #dc2626;
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  transition: opacity 0.2s;
}
.modal-yt-btn:hover { opacity: 0.9; }

/* Reset button & footer tools */
.rst {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--mu);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.rst:hover { color: var(--tx); border-color: var(--bd-light); }

.backup-tools {
  margin-top: 16px;
  display: flex;
  gap: 8px;
  justify-content: center;
}
.btn-text {
  background: transparent;
  border: none;
  color: var(--mu);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}
.btn-text:hover { color: var(--ac); background: var(--bg-soft); }

.pwa-install-banner {
  display: none;
  background: var(--bg-soft);
  border: 1px solid var(--ac);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 14px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pwa-install-banner button {
  background: var(--ac);
  color: #041019;
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="top-nav">
  <div class="profile-switcher">
    <button class="profile-btn active" data-p="felipe">⚡ Felipe</button>
    <button class="profile-btn" data-p="mawi">🌸 Mawi</button>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btnSound" title="Alternar Sonido">🔊</button>
    <button class="btn-icon" id="btnHaptic" title="Alternar Vibración">📳</button>
    <button class="btn-icon" id="btnTheme" title="Alternar Tema Oscuro/Claro">🌙</button>
    <div class="streak-badge" id="streakBadge">🔥 0 días</div>
  </div>
</div>
<div class="sub" id="dt"></div>

<div class="pwa-install-banner" id="pwaBanner">
  <div>
    <div style="font-weight:700;font-size:14px;">Instalar como App</div>
    <div style="font-size:12px;color:var(--mu);">Acceso rápido y offline en tu celular</div>
  </div>
  <button id="pwaInstallBtn">Instalar</button>
</div>

<!-- Info banner for profile (Mawi) -->
<div id="profileInfoBox"></div>

<!-- Weekly streak tracking bar -->
<div class="week-bar" id="weekBar"></div>

<!-- Day selector tabs -->
<div class="tabs" id="tabs"></div>

<!-- Daily Progress block -->
<div id="ph"></div>

<!-- Main workout container -->

/* ==========================================================================
   CONFIGURACIÓN Y PREFERENCIAS
   ========================================================================== */
const CFG = {
  sound: true,
  haptic: true,
  theme: 'dark'
};
try {
  const savedCfg = JSON.parse(localStorage.getItem('rutina-cfg-v1') || '{}');
  Object.assign(CFG, savedCfg);
} catch (e) {}

function saveCfg() {
  try { localStorage.setItem('rutina-cfg-v1', JSON.stringify(CFG)); } catch (e) {}
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', CFG.theme);
  const themeBtn = document.getElementById('btnTheme');
  if (themeBtn) themeBtn.textContent = CFG.theme === 'light' ? '☀️' : '🌙';
}
applyTheme();

function applyToggles() {
  const sBtn = document.getElementById('btnSound');
  if (sBtn) {
    sBtn.textContent = CFG.sound ? '🔊' : '🔇';
    sBtn.className = 'btn-icon' + (CFG.sound ? '' : ' off');
  }
  const hBtn = document.getElementById('btnHaptic');
  if (hBtn) {
    hBtn.textContent = CFG.haptic ? '📳' : '📴';
    hBtn.className = 'btn-icon' + (CFG.haptic ? '' : ' off');
  }
}

document.getElementById('btnSound').onclick = () => {
  CFG.sound = !CFG.sound;
  saveCfg();
  applyToggles();
};
document.getElementById('btnHaptic').onclick = () => {
  CFG.haptic = !CFG.haptic;
  saveCfg();
  applyToggles();
};
document.getElementById('btnTheme').onclick = () => {
  CFG.theme = CFG.theme === 'dark' ? 'light' : 'dark';
  saveCfg();
  applyTheme();
};
applyToggles();

/* ==========================================================================
   AUDIO, VIBRACIÓN HÁPTICA Y WAKELOCK
   ========================================================================== */
let AC = null;
let WL = null;

function unlockSensory() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  try {
    if (navigator.wakeLock && !WL) {
      navigator.wakeLock.request('screen').then(l => {
        WL = l;
        l.addEventListener('release', () => { WL = null; });
      }).catch(() => {});
    }
  } catch (e) {}
}

function haptic(type) {
  if (!CFG.haptic) return;
  try {
    if (!('vibrate' in navigator)) return;
    if (type === 'tick') navigator.vibrate(35);
    else if (type === 'warn') navigator.vibrate([70]);
    else if (type === 'done') navigator.vibrate([180, 80, 240]);
  } catch (e) {}
}

function beep(freq, dur) {
  if (!CFG.sound) return;
  if (!AC) return;
  try {
    const osc = AC.createOscillator();
    const gain = AC.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, AC.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.4, AC.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    osc.connect(gain);
    gain.connect(AC.destination);
    osc.start();
    osc.stop(AC.currentTime + dur + 0.05);
  } catch (e) {}
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

/* ==========================================================================
   TEMPORIZADOR FLOTANTE (Work / Rest con Pausa / Reanudar)
   ========================================================================== */
let T = null;
let iv = null;

function startTimer(totalSec, label, kind, onEnd) {
  unlockSensory();
  T = {
    total: totalSec,
    end: Date.now() + totalSec * 1000,
    remaining: totalSec,
    paused: false,
    label: label,
    kind: kind,
    onEnd: onEnd,
    last: null,
    skip: false
  };
  clearInterval(iv);
  iv = setInterval(tick, 250);
  tick();
}

function tick() {
  const bar = document.getElementById('bar');
  if (!T) {
    bar.style.display = 'none';
    return;
  }

  const bpause = document.getElementById('bpause');
  if (T.paused) {
    bar.style.display = 'block';
    bpause.textContent = '▶ Reanudar';
    const bmode = document.getElementById('bmode');
    bmode.textContent = 'PAUSADO';
    bmode.className = 'paused';
    const bt = document.getElementById('bt');
    bt.textContent = fmt(T.remaining);
    bt.className = 'paused';
    return;
  }

  bpause.textContent = '⏸ Pausa';
  const left = Math.ceil((T.end - Date.now()) / 1000);
  T.remaining = Math.max(0, left);

  if (left <= 0) {
    const f = T.onEnd;
    const sk = T.skip;
    T = null;
    clearInterval(iv);
    bar.style.display = 'none';
    if (!sk) {
      beep(880, 0.2);
      haptic('done');
      setTimeout(() => { beep(1100, 0.4); }, 220);
    }
    if (f) f();
    return;
  }

  // Cuenta regresiva 3, 2, 1
  if (left <= 3 && T.last !== left) {
    T.last = left;
    beep(660, 0.12);
    haptic('warn');
  }

  bar.style.display = 'block';
  document.getElementById('bl').textContent = T.label;
  const bmode = document.getElementById('bmode');
  bmode.textContent = T.kind === 'work' ? 'TRABAJO' : 'DESCANSO';
  bmode.className = T.kind;

  const bt = document.getElementById('bt');
  bt.textContent = fmt(left);
  bt.className = T.kind;

  const pct = Math.max(0, Math.min(100, (left / T.total) * 100));
  const progBar = document.getElementById('timerProgBar');
  if (progBar) progBar.style.width = `${pct}%`;
}

document.getElementById('b15').onclick = () => {
  if (T) {
    if (T.paused) {
      T.remaining += 15;
      T.total += 15;
    } else {
      T.end += 15000;
      T.total += 15;
    }
    tick();
    haptic('tick');
  }
};

document.getElementById('bpause').onclick = () => {
  if (!T) return;
  if (T.paused) {
    T.paused = false;
    T.end = Date.now() + T.remaining * 1000;
  } else {
    T.paused = true;
    T.remaining = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  }
  tick();
  haptic('tick');
};

document.getElementById('bsk').onclick = () => {
  if (T) {
    T.paused = false;
    T.skip = true;
    T.end = 0;
    tick();
  }
};

document.getElementById('bx').onclick = () => {
  T = null;
  clearInterval(iv);
  tick();
};

/* ==========================================================================

   ========================================================================== */
function dotsHTML(day, cat, key, ex) {
  const c = getDone(day, `${cat}_${key}`);
  let h = '';
  for (let i = 0; i < ex.sets; i++) {
    const isDone = i < c;
    const isNext = i === c;
    h += `<button class="dot${isDone ? ' done' : ''}${isNext ? ' next' : ''}" ` +
         `data-d="${day}" data-cat="${cat}" data-k="${key}" data-i="${i}" ${i > c ? 'disabled' : ''}>` +
         `${isDone ? '✓' : (i + 1)}</button>`;
  }
  return h;
}

function renderHeaderProgress() {
  const prof = PROFILES[activeProfile];
  const cur = getCurDay();
  let tot = 0;
  let done = 0;
  const list = allExercisesOfDay();
  list.forEach(item => {
    tot += item.data.sets;
    done += getDone(cur, `${item.cat}_${item.key}`);
  });

  const pct = tot ? Math.round((done / tot) * 100) : 0;
  const isComplete = done === tot && tot > 0;

  document.getElementById('ph').innerHTML = `
    <div class="prog-box">
      <div class="prog-header">
        <span class="prog-title">${prof.days[cur].title}</span>
        <span class="prog-stats">${done} de ${tot} series (${pct}%)</span>
      </div>
      <div class="prog"><i style="width:${pct}%"></i></div>
    </div>
    ${isComplete ? '<div class="win">¡Sesión de hoy completada con éxito! 🎉🔥</div>' : ''}
  `;
}

function updateDotsOnly() {
  renderHeaderProgress();
  const cur = getCurDay();
  allExercisesOfDay().forEach(item => {
    const el = document.getElementById(`dots-${item.cat}-${item.key}`);
    if (el) el.innerHTML = dotsHTML(cur, item.cat, item.key, item.data);
    const cardEl = document.getElementById(`card-${item.cat}-${item.key}`);
    if (cardEl) {
      const c = getDone(cur, `${item.cat}_${item.key}`);
      if (c >= item.data.sets) cardEl.classList.add('all-done');
      else cardEl.classList.remove('all-done');
    }
  });
}

function tapDot(day, cat, key, i) {
  unlockSensory();
  const c = getDone(day, `${cat}_${key}`);
  const ex = EX_DB[key];

  if (i < c) {
    putDone(day, `${cat}_${key}`, i);
    haptic('tick');
    updateDotsOnly();
    return;
  }
  if (i > c) return;

  const nextVal = i + 1;
  const sets = ex.sets;
  const rest = ex.rest;
  const work = ex.work;

  function finishSet() {
    putDone(day, `${cat}_${key}`, nextVal);
    haptic('tick');
    updateDotsOnly();

    if (nextVal < sets && rest > 0) {
      startTimer(rest, `Descanso · ${ex.name} (serie ${nextVal + 1} de ${sets})`, 'rest', null);
    }
  }

  if (work > 0) {
    startTimer(work, `${ex.name} · Serie ${nextVal} de ${sets}`, 'work', finishSet);
  } else {
    beep(520, 0.08);
    finishSet();
  }
}

function updateStreak() {
  const today = new Date();
  const todayDow = today.getDay();
  const prof = PROFILES[activeProfile];
  let daysActiveThisWeek = 0;
  const startOfWeek = new Date(today);
  const currentDayOffset = (todayDow === 0) ? 7 : todayDow; // 1 = Lun, 7 = Dom
  startOfWeek.setDate(today.getDate() - currentDayOffset + 1);

  let weekHTML = '';
  for (let d = 1; d <= 5; d++) {
    const dayDate = new Date(startOfWeek);
    dayDate.setDate(startOfWeek.getDate() + (d - 1));
    const kDay = `${dayDate.getFullYear()}-${dayDate.getMonth() + 1}-${dayDate.getDate()}`;
    const dayData = S[kDay] || {};

    const hasActivity = Object.keys(dayData).some(k => {
      return (k.startsWith(`${activeProfile}_`) || (activeProfile === 'felipe' && !k.includes('_'))) && dayData[k] > 0;
    });
    if (hasActivity) daysActiveThisWeek++;

    const isToday = (d === todayDow);
    weekHTML += `
      <div class="week-day">
        <div class="week-dot${hasActivity ? ' done' : ''}${isToday ? ' active-day' : ''}">
          ${hasActivity ? '✓' : DN[d][0]}
        </div>
        <span>${DN[d]}</span>
      </div>
    `;
  }
  document.getElementById('weekBar').innerHTML = weekHTML;
  document.getElementById('streakBadge').textContent = `🔥 ${daysActiveThisWeek} de ${prof.targetDaysPerWeek} días`;
}

function switchProfile(newProfile) {
  activeProfile = newProfile;
  localStorage.setItem('rutina-prof-v1', activeProfile);
  document.body.setAttribute('data-active-p', activeProfile);

  document.querySelectorAll('.profile-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.p === activeProfile);
  });

  render();
}

function render() {
  const today = new Date();
  const todayDow = today.getDay();
  const prof = PROFILES[activeProfile];
  const cur = getCurDay();

  document.body.setAttribute('data-active-p', activeProfile);

  // Subtítulo con fecha
  document.getElementById('dt').textContent = `${prof.subtitle} · ${DN[todayDow]} ${today.getDate()}/${today.getMonth() + 1}`;

  // Tarjeta de info (Mawi)
  const infoBox = document.getElementById('profileInfoBox');
  if (prof.info) {
    infoBox.innerHTML = `
      <details class="info-card">
        <summary>🌸 Pautas y Objetivos de Mawi</summary>
        <ul>
          <li><strong>Perfil:</strong> ${prof.info.perfil}</li>
          <li><strong>Frecuencia:</strong> ${prof.info.frecuencia}</li>
          <li><strong>Intensidad:</strong> ${prof.info.intensidad}</li>
          <li><strong>Calentamiento:</strong> ${prof.info.calentamiento}</li>
          <li><strong>Nutrición:</strong> ${prof.info.nutricion}</li>
        </ul>
      </details>
    `;
  } else {
    infoBox.innerHTML = '';
  }

  // Pestañas de días
  let tabs = '';
  Object.keys(prof.days).forEach(dayKey => {
    const isSelected = String(dayKey) === String(cur);
    const label = activeProfile === 'felipe' ? DN[dayKey] : `Día ${dayKey}`;
    tabs += `<button class="tab${isSelected ? ' on' : ''}" data-t="${dayKey}">${label}</button>`;
  });
  document.getElementById('tabs').innerHTML = tabs;

  // Contenido de ejercicios
  let h = '';

  // Entrada en calor
  h += '<h2>🔥 Entrada en calor (~5-8 min)</h2>';
  prof.warmup.forEach(k => { h += cardHTML('w', k, EX_DB[k]); });

  // Bloque principal
  h += `<h2>💪 ${prof.days[cur].title}</h2>`;
  prof.days[cur].keys.forEach(k => { h += cardHTML('e', k, EX_DB[k]); });

  // Core (si aplica)
  if (prof.core.length > 0) {
    h += '<h2>🛡️ Core y Estabilidad</h2>';
    if (prof.coreWarning) {
      h += `<div class="note-warn">${prof.coreWarning}</div>`;
    }
    prof.core.forEach(k => { h += cardHTML('c', k, EX_DB[k]); });
  }

  // Reiniciar día
  h += '<button class="rst" id="rst">Reiniciar progreso de este día</button>';

  document.getElementById('main').innerHTML = h;

  renderHeaderProgress();
  updateStreak();
}

   ========================================================================== */
let modalCurrentKey = null;

function getModalExerciseKeys() {
  return allExercisesOfDay().map(item => item.key);
}

function openModal(key) {
  const ex = EX_DB[key];
  if (!ex) return;
  modalCurrentKey = key;
  document.getElementById('mTitle').textContent = ex.name;
  document.getElementById('mImg').src = CDN_BASE + ex.gif;

  const tipsList = document.getElementById('mTips');
  tipsList.innerHTML = '';
  ex.tips.forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    tipsList.appendChild(li);
  });

  const ytBtn = document.getElementById('mYt');
  ytBtn.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.yt)}`;

  document.getElementById('modalBackdrop').style.display = 'flex';
}

function navigateModal(delta) {
  const keys = getModalExerciseKeys();
  const idx = keys.indexOf(modalCurrentKey);
  if (idx === -1) return;
  const nextIdx = (idx + delta + keys.length) % keys.length;
  openModal(keys[nextIdx]);
}

document.getElementById('mPrev').onclick = () => navigateModal(-1);
document.getElementById('mNext').onclick = () => navigateModal(1);

function closeModal() {
  document.getElementById('modalBackdrop').style.display = 'none';
  document.getElementById('mImg').src = '';
  modalCurrentKey = null;
}

document.getElementById('mClose').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = (e) => {
  if (e.target.id === 'modalBackdrop') closeModal();
};
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (document.getElementById('modalBackdrop').style.display === 'flex') {
    if (e.key === 'ArrowLeft') navigateModal(-1);
    if (e.key === 'ArrowRight') navigateModal(1);
  }
});

/* ==========================================================================
   EVENT DELEGATION (Clicks, pestañas y confirmación de reset)
   ========================================================================== */
let rsT = null;
document.addEventListener('click', (ev) => {
  // Selector de perfil
  const profBtn = ev.target.closest('.profile-btn');
  if (profBtn && profBtn.dataset.p) {
    switchProfile(profBtn.dataset.p);
    return;
  }

  // Modal opener
  const openTarget = ev.target.closest('[data-open-key]');
  if (openTarget) {
    openModal(openTarget.dataset.openKey);
    return;
  }

  // Cambio de día (tab)
  const tabBtn = ev.target.closest('button[data-t]');
  if (tabBtn) {
    setCurDay(tabBtn.dataset.t);
    render();
    return;
  }

  // Toque de punto de serie (dot)
  const dotBtn = ev.target.closest('button.dot');
  if (dotBtn && dotBtn.dataset.k !== undefined && dotBtn.dataset.i !== undefined) {
    const day = dotBtn.dataset.d;
    const cat = dotBtn.dataset.cat;
    const key = dotBtn.dataset.k;
    const i = +dotBtn.dataset.i;
    tapDot(day, cat, key, i);
    return;
  }

  // Botón de reiniciar día
  const rstBtn = ev.target.closest('#rst');
  if (rstBtn) {
    const dk = getTodayKey();
    const cur = getCurDay();
    if (rsT) {
      clearTimeout(rsT);
      rsT = null;
      if (S[dk]) {
        Object.keys(S[dk]).forEach(k => {
          if (k.startsWith(`${activeProfile}_${cur}_`) || (activeProfile === 'felipe' && k.startsWith(`${cur}_`))) {
            delete S[dk][k];
          }
        });
      }
      save();
      updateDotsOnly();
      rstBtn.textContent = 'Reiniciar progreso de este día';
    } else {
      rstBtn.textContent = '¿Confirmar reinicio? Tocá otra vez';
      rsT = setTimeout(() => {
        rsT = null;
        rstBtn.textContent = 'Reiniciar progreso de este día';
      }, 3000);
    }
  }
});

  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(S, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute('href', dataStr);
  dlAnchor.setAttribute('download', `rutina-backup-${getTodayKey()}.json`);
  dlAnchor.click();
};

document.getElementById('btnImport').onclick = () => {
  document.getElementById('importInput').click();
};

document.getElementById('importInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const imported = JSON.parse(evt.target.result);
      if (typeof imported === 'object') {
        Object.assign(S, imported);
        save();
        render();
        alert('¡Historial restaurado con éxito!');
      }
    } catch (err) {
      alert('Error: el archivo no es un respaldo válido de Rutina.');
    }
  };
  reader.readAsText(file);
};

/* ==========================================================================
   SERVICE WORKER Y PWA PROMPT
   ========================================================================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      console.log('ServiceWorker registrado:', reg.scope);
    }).catch(err => {
      console.warn('Error al registrar ServiceWorker:', err);
    });
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const pwaBanner = document.getElementById('pwaBanner');
  if (pwaBanner) pwaBanner.style.display = 'flex';
});

document.getElementById('pwaInstallBtn').onclick = () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('pwaBanner').style.display = 'none';
    });
  }
};

// Primer render inicial
render();
</script>
</body>
</html>
