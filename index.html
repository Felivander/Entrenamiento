<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutina">
<title>Rutina</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14202b;--mu:#667585;--ac:#1f6fb2;--ok:#1e9e5a;--bd:#dfe5ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--card:#18212a;--tx:#e8eef4;--mu:#8fa0b0;--ac:#4aa3e8;--ok:#33c47a;--bd:#2a3744}}
:root[data-theme="dark"]{--bg:#0e141a;--card:#18212a;--tx:#e8eef4;--mu:#8fa0b0;--ac:#4aa3e8;--ok:#33c47a;--bd:#2a3744}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:14px 14px 160px;max-width:560px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;font-weight:600}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pt{font-size:13px;color:var(--mu);margin-bottom:12px}
.win{background:var(--ok);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:12px}
h2{font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gif{flex:0 0 96px;width:96px;height:96px;border-radius:10px;background:#fff;border:1px solid var(--bd);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:#667585;text-align:center}
.gif img{width:100%;height:100%;object-fit:contain}
.gif a{color:#1f6fb2;text-decoration:none;font-weight:600;padding:4px}
.nm{font-weight:700}
.mt{color:var(--mu);font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--ac);background:transparent;color:var(--ac);font-size:16px;font-weight:700}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.next{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.dot:disabled{opacity:.4;border-color:var(--bd);color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin:8px 2px}
.rst{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
#bar .in{max-width:560px;margin:0 auto}
#bl{font-size:13px;color:var(--mu);text-align:center}
#bt{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#bt.work{color:var(--ac)}#bt.rest{color:var(--ok)}
.br{display:flex;gap:8px;margin-top:8px}
.br button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-weight:600}
</style>
</head>
<body>
<h1>Rutina en casa</h1>
<div class="sub" id="dt"></div>
<div class="tabs" id="tabs"></div>
<div id="ph"></div>
<div id="main"></div>
<div id="bar"><div class="in">
  <div id="bl"></div><div id="bt">0:00</div>
  <div class="br"><button id="b15">+15 s</button><button id="bsk">Saltar</button><button id="bx">Cancelar</button></div>
</div></div>

<script>
// [nombre, series, reps, descanso(s), cronómetro(s) o 0, búsquedas del GIF (inglés)]
var D={
1:['Lunes · Tren superior',[['Dominadas',5,'4-8 reps',90,0,['pull-up','pull up']],['Flexiones',4,'10-15 reps',75,0,['push-up','push up']],['Fondos de tríceps en banco',3,'12-15 reps',60,0,['bench dip']],['Flexiones diamante o inclinadas',3,'al fallo −2',60,0,['diamond push-up','incline push-up']],['Colgarse de la barra',3,'30 s',60,30,['dead hang','hang','chin-up']]]],
2:['Martes · Piernas y potencia',[['Sentadilla búlgara',4,'8-10 por pierna',90,0,['bulgarian split squat','split squat']],['Sentadilla con salto',4,'6 reps',90,0,['jump squat','squat jump']],['Zancadas caminando',3,'12 por pierna',60,0,['walking lunge','lunge']],['Puente de glúteos a una pierna',3,'12 por pierna',60,0,['single leg glute bridge','glute bridge']],['Elevación de talones',3,'20 reps',45,0,['standing calf raise','calf raise']]]],
3:['Miércoles · Cardio y agilidad',[['Soga (1 min saltando)',10,'1 min',30,60,['jump rope','rope jump']],['Trote suave o caminata rápida',1,'15 min',0,900,['run','jog']],['Escalera de agilidad casera',8,'30 s',30,30,['agility ladder','lateral hop','side hop']]]],
4:['Jueves · Cuerpo completo',[['Chin-ups (agarre supino)',4,'4-8 reps',90,0,['chin-up','chin up']],['Flexiones con pausa abajo',4,'8-10 reps',75,0,['push-up','push up']],['Sentadilla con pausa de 2 s',4,'12 reps',75,0,['bodyweight squat','squat']],['Remo invertido bajo mesa firme',3,'10 reps',60,0,['inverted row']],['Fondos de tríceps en banco',3,'12 reps',60,0,['bench dip']]]],
5:['Viernes · Específico de fútbol',[['Sprints de 20-30 m',8,'1 sprint',60,0,['sprint','run']],['Intervalos 30 s fuerte / 30 s suave',10,'30 s fuerte',30,30,['high knees','mountain climber']],['Slalom o drill en T con conos',6,'1 recorrido',45,0,['cone drill','lateral shuffle','side shuffle']],['Saltos al banco',3,'6 reps',60,0,['box jump']]]]
};
var C=[['Plancha',3,'30-45 s',45,40,['plank']],['Dead bug',3,'10 por lado',45,0,['dead bug']],['Bird dog',3,'10 por lado',45,0,['bird dog']],['Plancha lateral',3,'20-30 s por lado',45,25,['side plank']],['Puente de glúteos con pausa',3,'12 reps',45,0,['glute bridge']]];
var DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var now=new Date(),dow=now.getDay(),cur=(dow>=1&&dow<=5)?dow:1;
var dk=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
var S={},G={};
try{S=JSON.parse(localStorage.getItem('rutina-v1')||'{}')}catch(e){}
try{G=JSON.parse(localStorage.getItem('rutina-gif-v1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('rutina-v1',JSON.stringify(S))}catch(e){}}
function saveG(){try{localStorage.setItem('rutina-gif-v1',JSON.stringify(G))}catch(e){}}
function get(day,k){return ((S[dk]||{})[day+k])||0}
function put(day,k,v){S[dk]=S[dk]||{};S[dk][day+k]=v;save()}
function allEx(){var a=[];D[cur][1].forEach(function(e,i){a.push(['e'+i,e])});C.forEach(function(e,i){a.push(['c'+i,e])});return a}

/* ---------- sonido ---------- */
var AC=null,WL=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  try{if(navigator.wakeLock&&!WL)navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null})}).catch(function(){})}catch(e){}}
function beep(f,d){if(!AC)return;try{var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.5,AC.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.05)}catch(e){}}
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}

/* ---------- timer ---------- */
var T=null,iv=null;
function startTimer(sec,label,kind,onEnd){T={end:Date.now()+sec*1000,label:label,kind:kind,onEnd:onEnd,last:null,skip:false};clearInterval(iv);iv=setInterval(tick,250);tick()}
function tick(){
  var bar=document.getElementById('bar');
  if(!T){bar.style.display='none';return}
  var left=Math.ceil((T.end-Date.now())/1000);
  if(left<=0){var f=T.onEnd,sk=T.skip;T=null;clearInterval(iv);bar.style.display='none';if(!sk){beep(880,.2);setTimeout(function(){beep(1100,.4)},230)}if(f)f();return}
  if(left<=3&&T.last!==left){T.last=left;beep(660,.12)}
  bar.style.display='block';
  document.getElementById('bl').textContent=T.label;
  var bt=document.getElementById('bt');bt.textContent=fmt(left);bt.className=T.kind;
}
document.getElementById('b15').onclick=function(){if(T){T.end+=15000;tick()}};
document.getElementById('bsk').onclick=function(){if(T){T.skip=true;T.end=0;tick()}};
document.getElementById('bx').onclick=function(){T=null;clearInterval(iv);tick()};

/* ---------- series ---------- */
function dotsHTML(day,k,ex){
  var c=get(day,k),h='';
  for(var i=0;i<ex[1];i++)h+='<button class="dot'+(i<c?' done':'')+(i===c?' next':'')+'" data-d="'+day+'" data-k="'+k+'" data-i="'+i+'"'+(i>c?' disabled':'')+'>'+(i<c?'✓':(i+1))+'</button>';
  return h;
}
function hdr(){
  var tot=0,done=0;allEx().forEach(function(a){tot+=a[1][1];done+=get(cur,a[0])});
  document.getElementById('ph').innerHTML='<div class="prog"><i style="width:'+(tot?done/tot*100:0)+'%"></i></div><div class="pt">'+D[cur][0]+' · '+done+' de '+tot+' series</div>'+(done===tot&&tot?'<div class="win">¡Sesión completa! 🎉</div>':'');
}
function update(){hdr();allEx().forEach(function(a){var el=document.getElementById('dots-'+a[0]);if(el)el.innerHTML=dotsHTML(cur,a[0],a[1])})}
function tapDot(day,k,ex,i){
  unlock();
  var c=get(day,k);
  if(i<c){put(day,k,i);update();return}
  if(i>c)return;
  var name=ex[0],sets=ex[1],rest=ex[3],work=ex[4];
  function finish(){put(day,k,i+1);update();if(i+1<sets&&rest>0)startTimer(rest,'Descanso · '+name+' (serie '+(i+2)+' de '+sets+')','rest',null)}
  if(work)startTimer(work,name+' · serie '+(i+1)+' de '+sets,'work',finish);
  else{beep(520,.08);finish()}
}

/* ---------- GIFs ---------- */
var EP=['https://oss.exercisedb.dev/api/v1/exercises?search=','https://oss.exercisedb.dev/api/v1/exercises/search?q=','https://oss.exercisedb.dev/api/v1/exercises?q='];
var goodEP=0,Q=Promise.resolve(),searchDead=false,IDX=null;
function fetchJ(u){var c=new AbortController(),t=setTimeout(function(){c.abort()},8000);return fetch(u,{signal:c.signal}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.json()})}
function collect(o,out){
  if(Array.isArray(o))o.forEach(function(x){collect(x,out)});
  else if(o&&typeof o==='object'){if(o.name&&(o.gifUrl||o.imageUrl))out.push(o);else Object.keys(o).forEach(function(k){collect(o[k],out)})}
  return out;
}
function norm(s){return String(s).toLowerCase().replace(/-/g,' ')}
function urlOf(o){return o.gifUrl||(/\.(gif|webp)(\?|$)/i.test(o.imageUrl||'')?o.imageUrl:null)}
function pick(list,q){
  var tk=norm(q).split(' '),best=null,bs=0;
  list.forEach(function(o){var u=urlOf(o);if(!u)return;var n=norm(o.name),m=0;tk.forEach(function(t){if(n.indexOf(t)>-1)m++});var s=m/tk.length-n.length/1000+(JSON.stringify(o.equipments||'').indexOf('body weight')>-1?0.05:0);if(s>bs){bs=s;best=u}});
  return bs>=0.6?best:null;
}
function search(q,n){
  n=n||0;if(searchDead)return Promise.resolve(null);if(n>=EP.length){searchDead=true;return Promise.resolve(null)}
  var idx=(goodEP+n)%EP.length;
  return fetchJ(EP[idx]+encodeURIComponent(q)+'&limit=25').then(function(j){var l=collect(j,[]);if(!l.length)throw 0;goodEP=idx;return pick(l,q)}).catch(function(){return search(q,n+1)});
}
function loadIdx(){
  if(IDX)return IDX;
  var all=[],off=0,pg=0;
  function nxt(){
    return fetchJ('https://oss.exercisedb.dev/api/v1/exercises?offset='+off+'&limit=100').then(function(j){
      var l=collect(j,[]);
      if(!l.length||pg>=40||(all.length&&l[0].exerciseId===all[0].exerciseId))return all;
      all=all.concat(l);off+=l.length;pg++;return nxt();
    });
  }
  IDX=nxt().catch(function(){return all});
  return IDX;
}
function findGif(qs,i){
  i=i||0;
  if(i>=qs.length)return loadIdx().then(function(l){for(var j=0;j<qs.length;j++){var u=pick(l,qs[j]);if(u)return u}return null});
  return search(qs[i]).then(function(u){return u||findGif(qs,i+1)});
}
function ytLink(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' ejercicio cómo se hace')}
function showGif(k,ex,retried){
  var box=document.getElementById('g-'+k);if(!box)return;
  var u=G[ex[0]];
  if(!u){box.innerHTML='<a href="'+ytLink(ex[0])+'" target="_blank" rel="noopener">▶ Ver video</a>';return}
  var im=new Image();im.alt=ex[0];
  im.onerror=function(){delete G[ex[0]];saveG();if(!retried)loadGif(k,ex,true);else showGif(k,ex,true)};
  im.src=u;box.innerHTML='';box.appendChild(im);
}
function loadGif(k,ex,force){
  if(G[ex[0]]&&!force){showGif(k,ex);return}
  Q=Q.then(function(){return findGif(ex[5])}).then(function(u){if(u){G[ex[0]]=u;saveG()}showGif(k,ex,true)},function(){showGif(k,ex,true)});
}

/* ---------- render ---------- */
function card(k,ex){
  return '<div class="card"><div class="row"><div class="gif" id="g-'+k+'">…</div><div><div class="nm">'+ex[0]+'</div><div class="mt">'+ex[1]+' × '+ex[2]+(ex[3]?' · descanso '+ex[3]+' s':'')+(ex[4]?' · cronómetro '+fmt(ex[4]):'')+'</div></div></div><div class="dots" id="dots-'+k+'">'+dotsHTML(cur,k,ex)+'</div></div>';
}
function render(){
  var tabs='';for(var d=1;d<=5;d++)tabs+='<button class="tab'+(d===cur?' on':'')+'" data-t="'+d+'">'+DN[d]+'</button>';
  document.getElementById('tabs').innerHTML=tabs;
  document.getElementById('dt').textContent=DN[dow]+' '+now.getDate()+'/'+(now.getMonth()+1)+(dow===0||dow===6?' · hoy es descanso activo':'');
  var h='<div class="note">Antes: 8 min de entrada en calor (soga suave, movilidad).</div><h2>Bloque principal</h2>';
  D[cur][1].forEach(function(e,i){h+=card('e'+i,e)});
  h+='<h2>Core</h2><div class="note">Progresá de a poco; frená si sentís tirón, dolor o un bulto en la cicatriz.</div>';
  C.forEach(function(e,i){h+=card('c'+i,e)});
  h+='<button class="rst" id="rst">Reiniciar este día</button>';
  document.getElementById('main').innerHTML=h;
  hdr();
  allEx().forEach(function(a){loadGif(a[0],a[1])});
}
var rsT=null;
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.dataset.t){cur=+t.dataset.t;render();return}
  if(t.dataset.k!==undefined&&t.dataset.i!==undefined){
    var day=+t.dataset.d,k=t.dataset.k,ex=k[0]==='e'?D[day][1][+k.slice(1)]:C[+k.slice(1)];
    tapDot(day,k,ex,+t.dataset.i);return}
  if(t.id==='rst'){
    if(rsT){clearTimeout(rsT);rsT=null;if(S[dk])Object.keys(S[dk]).forEach(function(x){if(x.charAt(0)==cur)delete S[dk][x]});save();update();var b=document.getElementById('rst');if(b)b.textContent='Reiniciar este día'}
    else{t.textContent='Tocá otra vez para confirmar';rsT=setTimeout(function(){rsT=null;var b=document.getElementById('rst');if(b)b.textContent='Reiniciar este día'},3000)}
  }
});
render();
</script>
</body>
</html>
